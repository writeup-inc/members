<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="特集記事のカバー">
  <defs>
    <clipPath id="c"><rect width="1200" height="675"/></clipPath>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0C0B"/><stop offset="1" stop-color="#232624"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6E7370"/><stop offset="1" stop-color="#EDEEEC"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="675" fill="url(#g)"/>
    <rect width="1200" height="675" fill="url(#grid)"/>
    <!-- 四分円。明部は右上に置き、文字が載る左下は暗く保つ -->
    <path d="M1200 0v430A430 430 0 0 0 770 0z" fill="url(#arc)"/>
    <path d="M1200 0v236A236 236 0 0 0 964 0z" fill="#161817"/>
    <circle cx="1200" cy="0" r="545" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="1"/>
    <circle cx="1200" cy="0" r="648" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="1"/>
    <g stroke="#ffffff" stroke-opacity=".22" stroke-width="1">
      <line x1="80" y1="596" x2="248" y2="596"/>
      <line x1="80" y1="612" x2="172" y2="612"/>
    </g>
    <rect x="0" y="669" width="1200" height="6" fill="#EDEEEC"/>
  </g>
</svg>
