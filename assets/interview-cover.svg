    <line x1="0" y1="675" x2="1200" y2="675" stroke="#C8732F" stroke-width="6"/>
    <g stroke="#ffffff" stroke-opacity=".16" stroke-width="1">
      <line x1="80" y1="600" x2="240" y2="600"/>
      <line x1="80" y1="616" x2="180" y2="616"/>
