<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F7B5F">
<title>ただいま生成中｜代表 白石に聞く</title>
<style>
/* lp-base.css — 日本語LP／HTML成果物の初期CSS
 *
 * 品質台帳（~/Documents/Codex/loop-engineering-memory/events.jsonl）で
 * 再発が確認された表示欠陥を、指摘ではなく初期値で潰すためのファイル。
 * 対応する欠陥ID:
 *   japanese-heading-midword-wrap（見出しが単語途中で改行）11回
 *   mobile-fv-headline-wrap（モバイルFVの見出し改行）3回
 *   mobile-fixed-cta-overlap（固定CTAが本文を隠す）3回
 *   meaningful-small-text-under-readable-size（意味のある文字が可読サイズ未満）5回
 *
 * 使い方: HTMLの<style>先頭にこの内容を貼る。色・書体・余白は各LPで上書きしてよいが、
 * 下の「改行制御」「最小文字サイズ」「固定CTAの逃げ」の3ブロックは消さないこと。
 */

/* ── 改行制御 ─────────────────────────────────────────────
 * 日本語は単語区切りが無いため、既定のままだと文節の途中で折り返す。
 * auto-phrase は文節単位で折る（Chrome 119+）。非対応環境は strict で逃がす。 */
h1, h2, h3, h4, h5,
.lead, .catch, .hero__title, [data-keep-phrase] {
  word-break: auto-phrase;
  line-break: strict;
  overflow-wrap: anywhere;
}
@supports not (word-break: auto-phrase) {
  h1, h2, h3, h4, h5,
  .lead, .catch, .hero__title, [data-keep-phrase] {
    word-break: normal;
  }
}
/* 明示的に折りたくない語の途中で切られたら、その語を <span class="nobr"> で包む */
.nobr { white-space: nowrap; }

/* ── 最小文字サイズ ───────────────────────────────────────
 * 判断材料になる文字は12px未満にしない。注記・免責のみ .note を許容。 */
:root { --fs-min: 12px; --fs-body: 16px; }
body { font-size: var(--fs-body); line-height: 1.8; }
small, .note, figcaption { font-size: var(--fs-min); line-height: 1.7; }

/* ── ファーストビューの見出し ─────────────────────────────
 * 固定pxだと狭い画面で必ず折り返す。clamp で画面幅に追従させる。 */
h1, .hero__title { font-size: clamp(1.55rem, 5.2vw, 3.25rem); line-height: 1.35; }
h2 { font-size: clamp(1.3rem, 3.6vw, 2.1rem); line-height: 1.45; }

/* ── 固定CTAの逃げ ────────────────────────────────────────
 * 画面下に固定CTAを置くページは、この変数を実測の高さに書き換える。
 * 置かないページはそのままでよい（0のまま）。 */
:root { --fixed-cta-h: 0px; }
body { padding-bottom: calc(var(--fixed-cta-h) + env(safe-area-inset-bottom, 0px)); }

/* ── 横はみ出しの予防 ─────────────────────────────────────
 * flex/grid の子は既定で min-width:auto のため、長い語で親を押し広げる。 */
*, *::before, *::after { box-sizing: border-box; }
img, svg, video, canvas, iframe { max-width: 100%; height: auto; }
main > *, section > *, .grid > *, .flex > * { min-width: 0; }
pre, table, .scroll-x { overflow-x: auto; max-width: 100%; }


:root{
  --ink:#1d2320; --sub:#6d7370; --faint:#9aa09c;
  --green:#0F7B5F; --deep:#0D4A3A; --yellow:#FFC93C; --orange:#FF7A45; --mint:#4ECDA4;
  --bg:#FFFDF8; --card:#fff; --tint:#F4F7F4; --line:#e9ece9;
  --r:18px; --r-lg:24px; --shadow:0 2px 0 rgba(29,35,32,.06);
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic",Meiryo,-apple-system,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;color:var(--ink);background:var(--bg);
     font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;} img{display:block;}
.wrap{width:min(760px,calc(100% - 40px));margin:0 auto;}
.wrap--wide{width:min(1300px,calc(100% - 48px));}

.site-head{position:sticky;top:0;z-index:12;background:rgba(255,253,248,.92);backdrop-filter:blur(10px);border-bottom:2px solid var(--line);}
.site-head .wrap{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.brand{display:inline-flex;align-items:center;gap:10px;font-size:1rem;font-weight:800;}
.brand i{position:relative;width:26px;height:26px;border-radius:9px;background:var(--green);flex:none;}
.brand i::after{content:"";position:absolute;right:-4px;top:-4px;width:11px;height:11px;border-radius:50%;background:var(--yellow);}
.back{padding:7px 15px;border-radius:999px;background:var(--tint);color:#4a524d;font-size:.84rem;font-weight:800;white-space:nowrap;}
.back:hover{background:#e6ece8;color:var(--green);}

main{flex:1;padding:clamp(22px,3.4vw,38px) 0 clamp(40px,6vw,72px);}

.cover{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/9;background:var(--deep);}
.cover img{width:100%;height:100%;object-fit:cover;}
.cover .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(20px,4vw,44px);}
.cover .ov b{color:rgba(255,255,255,.8);font-size:.7rem;font-weight:800;letter-spacing:.16em;}
.cover .ov p{margin:10px 0 0;color:#fff;font-size:clamp(1.2rem,3.4vw,2rem);font-weight:800;line-height:1.45;}

.pill{display:inline-block;margin-top:clamp(20px,3vw,30px);padding:5px 14px;border-radius:999px;background:#FFE9DC;color:#B44B18;font-size:.74rem;font-weight:800;letter-spacing:.08em;}
h1{margin:12px 0 0;font-size:clamp(1.4rem,3.6vw,2.1rem);font-weight:800;line-height:1.5;}
.byline{display:flex;align-items:center;gap:11px;margin-top:16px;padding-bottom:22px;border-bottom:2px solid var(--line);}
.byline i{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--mint));flex:none;}
.byline span{color:var(--sub);font-size:.82rem;}
.byline em{display:block;font-style:normal;color:var(--ink);font-weight:800;font-size:.95rem;}

.status{display:flex;align-items:center;gap:13px;margin:26px 0 0;padding:20px 24px;border-radius:var(--r);background:#FFF4D6;}
.dots{display:inline-flex;gap:6px;flex:none;}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--orange);opacity:.3;animation:blink 1.25s infinite ease-in-out;}
.dots i:nth-child(2){animation-delay:.18s;} .dots i:nth-child(3){animation-delay:.36s;}
@keyframes blink{0%,70%,100%{opacity:.3;transform:translateY(0);}35%{opacity:1;transform:translateY(-4px);}}
.status p{margin:0;color:#6b5410;font-size:.97rem;font-weight:800;}

.skeleton{margin:28px 0 0;display:flex;flex-direction:column;gap:12px;}
.skeleton span{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--tint) 25%,#e9efea 50%,var(--tint) 75%);
  background-size:200% 100%;animation:shim 1.7s infinite linear;}
.skeleton span:nth-child(3){width:82%;} .skeleton span:nth-child(6){width:64%;}
@keyframes shim{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

.note{margin:28px 0 0;padding:22px 24px;border-radius:var(--r);background:var(--card);border:2px solid var(--line);color:var(--sub);font-size:.86rem;line-height:1.95;}
.note b{display:block;margin-bottom:6px;color:var(--green);font-size:.72rem;font-weight:800;letter-spacing:.12em;}
.go{display:inline-flex;align-items:center;gap:8px;min-height:46px;margin-top:26px;padding:0 24px;border-radius:999px;
    background:var(--green);color:#fff;font-size:.88rem;font-weight:800;}
.go:hover{background:var(--deep);}

footer{border-top:2px solid var(--line);padding:26px 0 40px;color:var(--faint);font-size:.78rem;}
h1,.note,.cover .ov p{word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere;}
@supports not (word-break:auto-phrase){ h1,.note,.cover .ov p{word-break:normal;} }
@media (max-width:430px){
  .brand{font-size:.85rem;gap:8px;white-space:nowrap;}
  .brand i{width:22px;height:22px;}
  .back{font-size:.78rem;padding:6px 12px;}
  .bk-long{display:none;}
}
@media (prefers-reduced-motion:reduce){ .dots i{animation:none;opacity:.6;} .skeleton span{animation:none;} }
</style>
</head>
<body>

</div></header>

<main><div class="wrap">
  <div class="cover">
    <img src="../assets/interview-cover.svg" width="1200" height="675" alt="">
    <span class="ov">
      <b>THIS MONTH ／ 2026.09</b>
      <p>今月の弊社AI事業、<br>注目ポイントとは。</p>
    </span>
  </div>

  <span class="pill">代表インタビュー</span>
  <h1>今月の弊社AI事業、注目ポイントとは。</h1>
  <div class="byline">
    <i aria-hidden="true"></i>
    <span><em>白石 崇</em>代表取締役　2026.09</span>

  <div class="status">
    <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>

</body>
</html>
