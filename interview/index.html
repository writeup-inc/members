<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#123B2E">
<title>ただいま生成中｜代表 白石に聞く</title>
<style>
/* lp-base.css — 日本語LP／HTML成果物の初期CSS
 *
 * 品質台帳（~/Documents/Codex/loop-engineering-memory/events.jsonl）で
 * 再発が確認された表示欠陥を、指摘ではなく初期値で潰すためのファイル。
 * 対応する欠陥ID:
 *   japanese-heading-midword-wrap（見出しが単語途中で改行）11回
 *   mobile-fv-headline-wrap（モバイルFVの見出し改行）3回
 *   mobile-fixed-cta-overlap（固定CTAが本文を隠す）3回
 *   meaningful-small-text-under-readable-size（意味のある文字が可読サイズ未満）5回
 *
 * 使い方: HTMLの<style>先頭にこの内容を貼る。色・書体・余白は各LPで上書きしてよいが、
 * 下の「改行制御」「最小文字サイズ」「固定CTAの逃げ」の3ブロックは消さないこと。
 */

/* ── 改行制御 ─────────────────────────────────────────────
 * 日本語は単語区切りが無いため、既定のままだと文節の途中で折り返す。
 * auto-phrase は文節単位で折る（Chrome 119+）。非対応環境は strict で逃がす。 */
h1, h2, h3, h4, h5,
.lead, .catch, .hero__title, [data-keep-phrase] {
  word-break: auto-phrase;
  line-break: strict;
  overflow-wrap: anywhere;
}
@supports not (word-break: auto-phrase) {
  h1, h2, h3, h4, h5,
  .lead, .catch, .hero__title, [data-keep-phrase] {
    word-break: normal;
  }
}
/* 明示的に折りたくない語の途中で切られたら、その語を <span class="nobr"> で包む */
.nobr { white-space: nowrap; }

/* ── 最小文字サイズ ───────────────────────────────────────
 * 判断材料になる文字は12px未満にしない。注記・免責のみ .note を許容。 */
:root { --fs-min: 12px; --fs-body: 16px; }
body { font-size: var(--fs-body); line-height: 1.8; }
small, .note, figcaption { font-size: var(--fs-min); line-height: 1.7; }

/* ── ファーストビューの見出し ─────────────────────────────
 * 固定pxだと狭い画面で必ず折り返す。clamp で画面幅に追従させる。 */
h1, .hero__title { font-size: clamp(1.55rem, 5.2vw, 3.25rem); line-height: 1.35; }
h2 { font-size: clamp(1.3rem, 3.6vw, 2.1rem); line-height: 1.45; }

/* ── 固定CTAの逃げ ────────────────────────────────────────
 * 画面下に固定CTAを置くページは、この変数を実測の高さに書き換える。
 * 置かないページはそのままでよい（0のまま）。 */
:root { --fixed-cta-h: 0px; }
body { padding-bottom: calc(var(--fixed-cta-h) + env(safe-area-inset-bottom, 0px)); }

/* ── 横はみ出しの予防 ─────────────────────────────────────
 * flex/grid の子は既定で min-width:auto のため、長い語で親を押し広げる。 */
*, *::before, *::after { box-sizing: border-box; }
img, svg, video, canvas, iframe { max-width: 100%; height: auto; }
main > *, section > *, .grid > *, .flex > * { min-width: 0; }
pre, table, .scroll-x { overflow-x: auto; max-width: 100%; }


:root{
  --ink:#1A1D1B; --sub:#6B716D; --faint:#9CA19D;
  --green:#123B2E; --terra:#C8732F;
  --bg:#FBFAF7; --card:#fff; --tint:#F2F1EC; --line:#E4E4DF;
  --r:10px; --r-sm:4px; --r-xs:3px;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic",Meiryo,-apple-system,sans-serif;
  --num:"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;color:var(--ink);background:var(--bg);
     font-family:var(--sans);line-height:1.75;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;} img{display:block;}
.wrap{width:min(760px,calc(100% - 40px));margin:0 auto;}
.wrap--wide{width:min(1300px,calc(100% - 56px));}

.site-head{position:sticky;top:0;z-index:12;background:rgba(251,250,247,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.site-head .wrap{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.brand{display:inline-flex;align-items:center;gap:11px;font-size:.9rem;font-weight:700;letter-spacing:.1em;}
.brand i{position:relative;width:18px;height:18px;background:var(--green);flex:none;}
.brand i::after{content:"";position:absolute;right:-5px;bottom:-5px;width:8px;height:8px;background:var(--terra);}
.back{color:#525853;font-size:.82rem;font-weight:700;letter-spacing:.04em;white-space:nowrap;}
.back:hover{color:var(--green);}

main{flex:1;padding:clamp(26px,3.6vw,44px) 0 clamp(44px,6vw,76px);}

.cover{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;background:var(--green);}
.cover img{width:100%;height:100%;object-fit:cover;}
.cover .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(20px,4vw,42px);}
.cover .ov b{font-family:var(--num);color:rgba(255,255,255,.72);font-size:.7rem;font-weight:700;letter-spacing:.2em;}
.cover .ov p{margin:12px 0 0;color:#fff;font-size:clamp(1.15rem,3.2vw,1.85rem);font-weight:700;line-height:1.5;}

.pill{display:inline-block;margin-top:clamp(24px,3vw,34px);padding:4px 10px;border:1px solid var(--terra);border-radius:var(--r-xs);
      color:var(--terra);font-size:.68rem;font-weight:800;letter-spacing:.14em;}
h1{margin:14px 0 0;font-size:clamp(1.4rem,3.4vw,2rem);font-weight:700;line-height:1.55;letter-spacing:.01em;}
.byline{display:flex;align-items:center;gap:12px;margin-top:20px;padding-bottom:24px;border-bottom:1px solid var(--line);}
.byline i{width:40px;height:40px;border-radius:50%;background:var(--green);flex:none;}
.byline span{color:var(--faint);font-size:.8rem;}
.byline em{display:block;font-style:normal;color:var(--ink);font-weight:700;font-size:.92rem;letter-spacing:.02em;}

.status{display:flex;align-items:center;gap:14px;margin:28px 0 0;padding:18px 22px;border-left:3px solid var(--terra);background:var(--tint);}
.dots{display:inline-flex;gap:6px;flex:none;}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--terra);opacity:.3;animation:blink 1.3s infinite ease-in-out;}
.dots i:nth-child(2){animation-delay:.18s;} .dots i:nth-child(3){animation-delay:.36s;}
@keyframes blink{0%,70%,100%{opacity:.3;}35%{opacity:1;}}
.status p{margin:0;color:#4d534f;font-size:.92rem;font-weight:700;letter-spacing:.03em;}

.skeleton{margin:30px 0 0;display:flex;flex-direction:column;gap:13px;}
.skeleton span{height:13px;border-radius:var(--r-xs);background:linear-gradient(90deg,var(--tint) 25%,#e9e8e2 50%,var(--tint) 75%);
  background-size:200% 100%;animation:shim 1.8s infinite linear;}
.skeleton span:nth-child(3){width:82%;} .skeleton span:nth-child(6){width:64%;}
@keyframes shim{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

.note{margin:30px 0 0;padding-top:24px;border-top:1px solid var(--line);color:var(--sub);font-size:.85rem;line-height:1.95;}
.note b{display:block;margin-bottom:7px;color:var(--green);font-size:.68rem;font-weight:800;letter-spacing:.18em;}
.go{display:inline-flex;align-items:center;gap:10px;min-height:44px;margin-top:28px;padding:0 22px;border-radius:var(--r-sm);
    background:var(--green);color:#fff;font-size:.83rem;font-weight:700;letter-spacing:.06em;}
.go:hover{background:#0c2b20;}

footer{border-top:1px solid var(--line);padding:28px 0 44px;color:var(--faint);font-size:.76rem;letter-spacing:.03em;}
h1,.note,.cover .ov p{word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere;}
@supports not (word-break:auto-phrase){ h1,.note,.cover .ov p{word-break:normal;} }
@media (max-width:430px){
  .wrap--wide{width:calc(100% - 32px);}
  .brand{font-size:.78rem;gap:9px;white-space:nowrap;}
  .brand i{width:15px;height:15px;}
  .back{font-size:.76rem;}
  .bk-long{display:none;}
}
@media (prefers-reduced-motion:reduce){ .dots i{animation:none;opacity:.6;} .skeleton span{animation:none;} }
</style>
</head>

<main><div class="wrap">

  <span class="pill">代表インタビュー</span>
  <h1>今月の弊社AI事業、注目ポイントとは。</h1>

</body>
</html>
